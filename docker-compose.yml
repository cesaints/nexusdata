# =============================================================================
# NexusData — stack local completa.
#   make up      → sobe tudo
#   make migrate → aplica as migrations
#   make seed    → cria tenant + admin de exemplo
# =============================================================================
name: nexusdata

x-app-env: &app-env
  NEXUS_ENVIRONMENT: local
  NEXUS_LOG_LEVEL: INFO
  NEXUS_JWT_SECRET_KEY: dev_local_secret_change_me_0123456789abcdef0123456789
  NEXUS_POSTGRES_HOST: postgres
  NEXUS_POSTGRES_USER: nexus
  NEXUS_POSTGRES_PASSWORD: nexus_dev_password
  NEXUS_POSTGRES_DB: nexusdata
  NEXUS_REDIS_HOST: redis
  NEXUS_RABBITMQ_HOST: rabbitmq
  NEXUS_RABBITMQ_USER: nexus
  NEXUS_RABBITMQ_PASSWORD: nexus_dev_password
  NEXUS_QDRANT_HOST: qdrant
  NEXUS_CORS_ORIGINS: '["http://localhost:5173"]'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      POSTGRES_DB: nexusdata
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusdata"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: nexus
      RABBITMQ_DEFAULT_PASS: nexus_dev_password
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
    profiles: ["ai"]

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command:
      ["uvicorn", "nexusdata.main:app", "--host", "0.0.0.0", "--port", "8000",
       "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command:
      ["celery", "-A", "nexusdata.worker.celery_app.celery_app", "worker",
       "-Q", "nexus.documents,nexus.webhooks", "--loglevel=info", "--concurrency=4"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports: ["3000:3000"]
    volumes:
      - "./docker/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "grafanadata:/var/lib/grafana"
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  grafanadata:
